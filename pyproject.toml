[project]
name = "cantrip-tailor"
version = "0.2.0"
description = "Works out the best set of gear to wear in Asheron's Call (AC:Unreal client): which pieces, worn together, give the best cantrip coverage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Moore" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",      # the solver is a small integer programme (scipy.optimize.milp, which bundles HiGHS)
]

[project.scripts]
# `uv run cantrip-tailor ...` after `uv sync`, or just `cantrip-tailor ...` after `pip install .`
cantrip-tailor = "cantrip_tailor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cantrip_tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8",
    "lupa>=2.2",   # embedded Lua, so the tests can run the real plugin
]
